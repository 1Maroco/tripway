<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripWay - Contato</title>
</head>
<body>
    <header>
        <h1>TripWay</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="./destinos.html">Destinos</a></li>
                <li><a href="./pacotes.html">Pacotes</a></li>
                <li><a href="./contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Faça sua reserva!</h2>
            <p>Conte-nos para onde você quer ir e quando. Assim que recebermos sua solicitação, um de nossos consultores entrará em contato para montar o roteiro perfeito para você.</p>
            <!-- imagem do contato entra aqui -->
        </section>

        <section>
            <form action="#" method="post">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="destino">Destino de interesse:</label>
                <select id="destino" name="destino" required>
                    <option value="">Selecione</option>
                    <option value="destino1">Destino 1</option>
                    <option value="destino2">Destino 2</option>
                    <option value="destino3">Destino 3</option>
                </select>

                <label for="data">Data:</label>
                <input type="date" id="data" name="data" required>

                <label for="pessoas">Qnt. de pessoas:</label>
                <input type="number" id="pessoas" name="pessoas" min="1" required>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem..."></textarea>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TripWay</p>
    </footer>
    
</body>
</html>
